name: release

# A tag publishes the Mac app: the same bundle CI builds on every pull
# request, but signed with the Developer ID certificate and notarised, then
# attached to the GitHub release. Unsigned is not publishable — macOS refuses
# a downloaded app that Apple has not seen — so this fails fast when the
# secrets are missing rather than shipping an image nobody can open.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Signing secrets are present
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            echo "A release needs an Apple Developer ID Application certificate (as base64"
            echo "of the .p12 in APPLE_CERTIFICATE) and an app-specific password for"
            echo "notarisation. Without them the disk image is refused by Gatekeeper on"
            echo "every Mac but the one that built it. The unsigned build for testing is"
            echo "the ci workflow's mac-app artifact."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      # The same key the mac-app job fills on main, so a tag starts warm.
      # It never writes: a cache saved under a tag's ref is readable from
      # that tag alone, which is quota spent on nobody.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
          shared-key: mac-dmg
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tauri CLI
        run: npm ci
        working-directory: app

      # Tauri reads these itself: it imports the certificate into a temporary
      # keychain, signs the app and the sidecar inside out, submits to the
      # notary service and staples the ticket.
      - name: Bundle, sign and notarise
        working-directory: app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build --target aarch64-apple-darwin

      - name: Verify the disk image
        env:
          EXPECT_SIGNED: "1"
        run: app/scripts/verify-dmg.sh "$(ls app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)"

      - uses: actions/upload-artifact@v4
        with:
          name: ableton-music-maker-dmg
          path: app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" \
            app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg --clobber
