name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: No HTTP client in the dependency tree
        run: |
          if cargo tree -e normal --locked | grep -E '^[^a-zA-Z0-9_-]*(ureq|reqwest|hyper|curl|isahc|attohttpc) '; then
            echo "an HTTP client entered the dependency tree; the server must have no upload path"; exit 1
          fi
      - name: Docs fact check
        run: scripts/check-docs-facts.sh

  # macos-latest is Apple Silicon, and the app ships for M-series Macs. The
  # bundle is signed ad-hoc here, not with a Developer ID and not notarised:
  # it runs, but a Mac that downloads it refuses it until the quarantine flag
  # is removed. A tag does it properly — .github/workflows/release.yml.
  mac-app:
    runs-on: macos-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tauri CLI
        run: npm ci
        working-directory: app
      # Two things make this reliable, and both are easy to lose:
      # GitHub sets CI=true, which is what makes Tauri pass --skip-jenkins to
      # bundle_dmg.sh — a runner has no Finder to send the cosmetic AppleScript
      # to, and that step exits 64 when it cannot. And the ad-hoc identity "-"
      # makes Tauri seal the bundle inside out; without it the app carries only
      # the linker's own signature, has no _CodeSignature, and `codesign
      # --verify` refuses it. Notarisation is skipped with a warning here.
      - name: Bundle the app and the disk image
        working-directory: app
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --target aarch64-apple-darwin
      - name: Verify the disk image
        run: app/scripts/verify-dmg.sh "$(ls app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)"
      - uses: actions/upload-artifact@v4
        with:
          name: ableton-music-maker-dmg-testing-only
          path: app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Say how to open it
        run: |
          {
            echo "### Mac app disk image"
            echo
            echo "Artifact \`ableton-music-maker-dmg-testing-only\` — Apple Silicon, ad-hoc"
            echo "signed, **not notarised**. macOS refuses a downloaded copy until the"
            echo "quarantine flag is off:"
            echo
            echo '```bash'
            echo 'xattr -dr com.apple.quarantine "/Applications/Ableton Music Maker.app"'
            echo '```'
            echo
            echo "A \`v*\` tag builds the signed, notarised image that needs none of this."
          } >> "$GITHUB_STEP_SUMMARY"

  # One native runner per architecture: a Rust release build under QEMU
  # emulation takes hours, a native one minutes.
  image:
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE_LOCAL: mcp-ableton-music-maker:local
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build test stage (runs the suite inside the image)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Build runtime stage
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: ${{ env.IMAGE_LOCAL }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Verify runtime image
        run: docker/verify-image.sh ${{ env.IMAGE_LOCAL }}

      - name: Scan for critical CVEs
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_LOCAL }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Image name for GHCR (must be lowercase)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "IMAGE_GHCR=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push per-architecture image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ env.IMAGE_GHCR }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}

  manifest:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Image name for GHCR (must be lowercase)
        run: echo "IMAGE_GHCR=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge into a multi-architecture image
        run: |
          docker buildx imagetools create \
            -t "$IMAGE_GHCR:${{ github.sha }}" \
            -t "$IMAGE_GHCR:latest" \
            "$IMAGE_GHCR:${{ github.sha }}-amd64" \
            "$IMAGE_GHCR:${{ github.sha }}-arm64"
          docker buildx imagetools inspect "$IMAGE_GHCR:latest"
