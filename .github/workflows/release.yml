name: release

# A tag publishes the Mac app to the GitHub release the README's download link
# serves. With the six APPLE_* secrets it is signed with the Developer ID
# certificate and notarised. Without them it is the same ad-hoc signed image CI
# builds, published as it is: the release notes and the README say it is not
# notarised and how to open it. Adding the secrets makes the next tag signed,
# with nothing else to change.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Signed, or not yet
        id: mode
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::missing repository secrets:$missing — publishing the ad-hoc signed image, not notarised"
          else
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      # The same key the mac-app job fills on main, so a tag starts warm.
      # It never writes: a cache saved under a tag's ref is readable from
      # that tag alone, which is quota spent on nobody.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
          shared-key: mac-dmg
          save-if: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Tauri CLI
        run: npm ci
        working-directory: app

      # Tauri reads these itself: it imports the certificate into a temporary
      # keychain, signs the app and the sidecar inside out, submits to the
      # notary service and staples the ticket.
      - name: Bundle, sign and notarise
        if: steps.mode.outputs.signed == 'true'
        working-directory: app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri -- build --target aarch64-apple-darwin

      # As in CI: the ad-hoc identity "-" makes Tauri seal the bundle, and
      # notarisation is skipped with a warning.
      - name: Bundle, ad-hoc signed
        if: steps.mode.outputs.signed != 'true'
        working-directory: app
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --target aarch64-apple-darwin

      - name: Verify the disk image
        env:
          EXPECT_SIGNED: ${{ steps.mode.outputs.signed == 'true' && '1' || '' }}
        run: app/scripts/verify-dmg.sh "$(ls app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)"

      - uses: actions/upload-artifact@v4
        with:
          name: ableton-music-maker-dmg
          path: app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          {
            echo "**[Download for Mac](https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/Ableton-Music-Maker-arm64.dmg)**: Apple Silicon. Open the disk image and drag the app to Applications."
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Signed with a Developer ID and notarised by Apple."
            else
              echo "> [!IMPORTANT]"
              echo "> This build is **not yet signed or notarised by Apple**, so macOS will say it is damaged or cannot be checked. After dragging it to Applications, run this once in Terminal:"
              echo ">"
              echo '> ```bash'
              echo '> xattr -dr com.apple.quarantine "/Applications/Ableton Music Maker.app"'
              echo '> ```'
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          gh release edit "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          # Tauri names the image after the version; the README links a name
          # that never changes, through releases/latest/download/.
          dmg="$(ls app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)"
          cp "$dmg" "$RUNNER_TEMP/Ableton-Music-Maker-arm64.dmg"
          gh release upload "$tag" "$dmg" "$RUNNER_TEMP/Ableton-Music-Maker-arm64.dmg" --clobber
          # Every new tag becomes the release the README's link serves, even one
          # created by hand before this ran.
          gh release edit "$tag" --latest
