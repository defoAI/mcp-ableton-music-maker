<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live · visual</title>
<style>
  /* One visual world, whatever the system theme: this window sits on a
     projector or beside Live, never inside the app's chrome. */
  :root {
    --ink: #EDEBE6;
    --dim: rgba(237, 235, 230, 0.55);
    --mono: "SF Mono", Menlo, Consolas, monospace;
    --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: #000; color: var(--ink); overflow: hidden; user-select: none; -webkit-user-select: none; font: 13px/1.4 var(--ui); }
  body.hidecursor { cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .drag { position: fixed; top: 0; left: 0; right: 0; height: 28px; z-index: 3; }
  .hud { position: fixed; left: 18px; bottom: 16px; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .6s; display: grid; gap: 4px; }
  .hud.show { opacity: 1; }
  .hud .name { font-size: 22px; font-weight: 600; letter-spacing: -.01em; text-shadow: 0 1px 12px rgba(0,0,0,.8); }
  .hud .line { font-family: var(--mono); font-size: 11px; color: var(--dim); text-shadow: 0 1px 8px rgba(0,0,0,.8); }
  .help { position: fixed; right: 18px; top: 16px; z-index: 4; pointer-events: none; opacity: 0; transition: opacity .35s; text-align: right; font-family: var(--mono); font-size: 11px; color: var(--dim); text-shadow: 0 1px 8px rgba(0,0,0,.8); line-height: 1.7; }
  .help.show { opacity: 1; }
  .help b { color: var(--ink); font-weight: 500; }
  .center { position: fixed; inset: 0; display: grid; place-items: center; z-index: 2; pointer-events: none; opacity: 0; transition: opacity .6s; text-align: center; color: var(--dim); }
  .center.show { opacity: 1; }
  .center h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; color: var(--ink); }
  .btns { position: fixed; right: 14px; bottom: 14px; z-index: 5; display: flex; gap: 6px; opacity: 0; transition: opacity .35s; }
  .btns.show { opacity: 1; }
  .btns button { font: inherit; color: var(--ink); background: rgba(20,20,20,.7); border: 1px solid rgba(255,255,255,.18); border-radius: 7px; padding: 4px 10px; backdrop-filter: blur(8px); }
  .btns button:active { filter: brightness(1.3); }
  @media (prefers-reduced-motion: reduce) { .hud, .center, .help, .btns { transition: none; } }
</style>
</head>
<body>
<div class="drag" data-tauri-drag-region></div>
<canvas id="gl"></canvas>
<div class="center" id="center"><div><h1>Waiting for Live</h1><div>Start listening in the app, then play something.</div></div></div>
<div class="hud" id="hud"><div class="name" id="pname">—</div><div class="line" id="pline"></div></div>
<div class="help" id="help">
  <div><b>space</b> somewhere else · <b>→</b> / <b>←</b> step in order</div>
  <div><b>A</b> wander on its own · <b>F</b> full screen · <b>esc</b> leave full screen</div>
  <div><b>H</b> this help · <b>1–8</b> a preset by number, rolled anew</div>
</div>
<div class="btns" id="btns"><button id="b-next">Next</button><button id="b-full">Full screen</button></div>

<script src="visual-presets.js"></script>
<script>
(function () {
  'use strict';
  const { PRESETS, makeBlender, TAU } = window.AMMPresets;
  const canvas = document.getElementById('gl');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, premultipliedAlpha: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' });
  const hud = document.getElementById('hud'), pname = document.getElementById('pname'), pline = document.getElementById('pline');
  const help = document.getElementById('help'), center = document.getElementById('center'), btns = document.getElementById('btns');
  const tauriWin = () => (window.__TAURI__ && window.__TAURI__.window) ? window.__TAURI__.window.getCurrentWindow() : null;

  if (!gl) {
    center.classList.add('show');
    center.innerHTML = '<div><h1>No WebGL 2</h1><div>This Mac’s web view cannot draw the visual.</div></div>';
    return;
  }

  // How long one preset becomes another, and how long it stays before the
  // next. The transition is deliberately slower than a bar at most tempos:
  // it should read as the picture evolving, never as a change of slide.
  // Nominal only: the blender rolls each transition somewhere between half
  // and one and a half times this, and the dwell below is rolled too, so
  // neither the order nor the pace of the changes is ever a pattern.
  const BLEND_SECS = 6.0;
  const AUTO_MIN = 11, AUTO_MAX = 30;

  // ── shaders ───────────────────────────────────────────────────────────────
  const VS_QUAD = `#version 300 es
  in vec2 aPos; out vec2 vUv;
  void main(){ vUv = aPos*0.5+0.5; gl_Position = vec4(aPos,0.0,1.0); }`;

  // Feedback: read the last frame through a warp, blur it a touch, fade it,
  // turn its hue. Two warp modes are evaluated and mixed, so a change of
  // preset bends the existing picture instead of replacing it. Every mode
  // *adds* to the base zoom and rotation; none assigns them, or one mode
  // would win outright halfway through a blend.
  const FS_WARP = `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 o;
  uniform sampler2D uPrev; uniform vec2 uRes; uniform float uTime;
  uniform float uZoom,uRot,uWarp,uWarpSpeed,uDx,uDy,uSx,uSy,uDecay,uHueShift,uBass,uMid,uTreb,uBlend,uSwirl,uRipple;
  uniform int uModeA, uModeB;

  vec3 hue(vec3 c, float a){ const vec3 k = vec3(0.57735); float cs=cos(a), sn=sin(a); return c*cs + cross(k,c)*sn + k*dot(k,c)*(1.0-cs); }

  void modeWarp(int m, vec2 c, float r, float ang, out float dz, out float dr, out vec2 push){
    dz = 0.0; dr = 0.0; push = vec2(0.0);
    if (m==1)      { dz = 0.06*sin(r*9.0 - uTime*2.5)*(0.5+uBass); }
    else if (m==2) { dr = 0.45*r*(0.6+uMid); dz = 0.03*uBass; }
    else if (m==3) { dz = 0.05*sin(ang*6.0+uTime*1.5)*(0.3+uTreb); dr = 0.08*sin(uTime*0.7); }
    else if (m==4) { dz = -0.025 - 0.06*uBass - 0.02*sin(uTime*0.9); dr = 0.02*sin(uTime*0.4); }
    else if (m==5) { push = 0.01*vec2(sin(uTime*0.8), cos(uTime*0.6))*(1.0+uMid); dz = 0.02*sin(uTime*1.3)*(0.5+uBass); }
    else if (m==6) { push = uWarp*0.02*vec2(sin(c.y*11.0+uTime*uWarpSpeed), cos(c.x*9.0-uTime*uWarpSpeed*1.1)); }
    else if (m==7) { float w = step(0.5, fract(ang/6.2831853*8.0 + uTime*0.05)); dz = 0.05*uBass*w - 0.02*uBass*(1.0-w); dr = 0.01; }
    else if (m==8) { dz = 0.07*(0.5 - r)*(0.6+uBass); dr = 0.05*sin(r*5.0 - uTime); }
    else if (m==9) { push = 0.014*vec2(sin(uTime*0.45), sin(uTime*0.9))*(0.7+uTreb); dr = 0.03*sin(uTime*0.23); }
  }

  void main(){
    float ar = uRes.x/uRes.y;
    vec2 c = (vUv-0.5)*vec2(ar,1.0);
    float r = length(c), ang = atan(c.y,c.x);

    float dzA,drA,dzB,drB; vec2 pushA,pushB;
    modeWarp(uModeA, c, r, ang, dzA, drA, pushA);
    modeWarp(uModeB, c, r, ang, dzB, drB, pushB);
    float zoom = uZoom + mix(dzA, dzB, uBlend);
    float rot  = uRot  + mix(drA, drB, uBlend);
    vec2 push  = mix(pushA, pushB, uBlend);

    // Rolled per variant, applied on top of whichever mode is running, so
    // they blend like every other number rather than switching on.
    rot  += uSwirl * r * (0.5 + uMid);
    zoom += uRipple * 0.05 * sin(r*14.0 - uTime*1.7 + uBass*2.0);

    c /= max(zoom, 0.2);
    float cs = cos(rot), sn = sin(rot); c = vec2(c.x*cs - c.y*sn, c.x*sn + c.y*cs);
    c += uWarp*0.01*vec2(sin(uTime*uWarpSpeed + c.y*8.0 + uBass*3.0), cos(uTime*uWarpSpeed*1.3 + c.x*6.0));
    c = c*vec2(uSx,uSy) + vec2(uDx,uDy) + push;

    vec2 uv = c/vec2(ar,1.0) + 0.5;
    vec2 px = 1.0/uRes;
    vec3 p = texture(uPrev, uv).rgb*0.44
           + (texture(uPrev, uv+vec2(px.x,0.0)).rgb + texture(uPrev, uv-vec2(px.x,0.0)).rgb
           +  texture(uPrev, uv+vec2(0.0,px.y)).rgb + texture(uPrev, uv-vec2(0.0,px.y)).rgb)*0.14;
    float edge = smoothstep(0.0,0.02,uv.x)*smoothstep(0.0,0.02,uv.y)*smoothstep(0.0,0.02,1.0-uv.x)*smoothstep(0.0,0.02,1.0-uv.y);
    p = hue(p, uHueShift);
    o = vec4(p*uDecay*edge, 1.0);
  }`;

  // The wave and the spectrum, as thick strips added over the feedback so
  // they leave trails.
  const VS_SHAPE = `#version 300 es
  in vec2 aPos; in float aT; out float vT;
  void main(){ vT = aT; gl_Position = vec4(aPos,0.0,1.0); }`;
  const FS_SHAPE = `#version 300 es
  precision highp float;
  in float vT; out vec4 o;
  uniform vec3 uColA, uColB; uniform float uAlpha;
  void main(){ o = vec4(mix(uColA, uColB, vT), uAlpha); }`;

  // Composite: the fold (which differs between presets, so it is sampled
  // twice and crossfaded), a touch of chroma on the beat, gamma, vignette.
  const FS_POST = `#version 300 es
  precision highp float;
  in vec2 vUv; out vec4 o;
  uniform sampler2D uTex; uniform vec2 uRes;
  uniform int uKaleidoA, uKaleidoB;
  uniform float uBright, uBeat, uTime, uGamma, uBlend, uChroma;

  vec2 fold(int n, vec2 c){
    if (n <= 0) return c;
    float seg = 6.2831853/float(n);
    float ang = atan(c.y,c.x), r = length(c);
    ang = mod(ang + uTime*0.05, seg);
    ang = abs(ang - seg*0.5);
    return vec2(cos(ang), sin(ang))*r;
  }
  vec3 grab(vec2 c, float ar, float sh){
    vec2 uv = clamp(c/vec2(ar,1.0) + 0.5, 0.0, 1.0);
    return vec3(texture(uTex, uv+vec2(sh,0.0)).r, texture(uTex, uv).g, texture(uTex, uv-vec2(sh,0.0)).b);
  }
  void main(){
    float ar = uRes.x/uRes.y; vec2 c = (vUv-0.5)*vec2(ar,1.0);
    float sh = 0.0035*uBeat*uChroma;
    vec3 col = grab(fold(uKaleidoA, c), ar, sh);
    if (uKaleidoA != uKaleidoB) col = mix(col, grab(fold(uKaleidoB, c), ar, sh), uBlend);
    col = pow(max(col*uBright, 0.0), vec3(1.0/uGamma));
    float vig = smoothstep(1.25, 0.3, length((vUv-0.5)*vec2(ar,1.0)));
    col *= mix(0.55, 1.0, vig);
    o = vec4(col, 1.0);
  }`;

  function compile(type, src) {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(vs, fs, attribs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    attribs.forEach((a, i) => gl.bindAttribLocation(p, i, a));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); u[info.name] = gl.getUniformLocation(p, info.name); }
    return { p, u };
  }
  let warpP, shapeP, postP;
  try {
    warpP = program(VS_QUAD, FS_WARP, ['aPos']);
    shapeP = program(VS_SHAPE, FS_SHAPE, ['aPos', 'aT']);
    postP = program(VS_QUAD, FS_POST, ['aPos']);
  } catch (e) {
    center.classList.add('show');
    center.innerHTML = '<div><h1>Shader failed</h1><div>' + String(e).replace(/</g, '&lt;') + '</div></div>';
    return;
  }

  // ── buffers ───────────────────────────────────────────────────────────────
  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const shapeBuf = gl.createBuffer();

  const halfFloat = !!gl.getExtension('EXT_color_buffer_float');
  let fbo = [null, null], tex = [null, null], W = 0, H = 0;
  function makeTargets() {
    for (let i = 0; i < 2; i++) {
      if (tex[i]) { gl.deleteTexture(tex[i]); gl.deleteFramebuffer(fbo[i]); }
      tex[i] = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex[i]);
      if (halfFloat) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, W, H, 0, gl.RGBA, gl.HALF_FLOAT, null);
      else gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      fbo[i] = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[i]);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex[i], 0);
      gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = Math.max(2, Math.round(window.innerWidth * dpr));
    const h = Math.max(2, Math.round(window.innerHeight * dpr));
    if (w === W && h === H) return;
    W = w; H = h; canvas.width = W; canvas.height = H;
    makeTargets();
  }
  window.addEventListener('resize', resize);
  resize();

  // ── audio ─────────────────────────────────────────────────────────────────
  const N = 256;
  const A = {
    vol: 0, bass: 0, mid: 0, treb: 0, bassAtt: 0, midAtt: 0, trebAtt: 0,
    beat: 0, lastBeat: 0, avg: 0.2, hat: 0, hatAvg: 0.2,
    wave: new Float32Array(N), waveTarget: new Float32Array(N),
    bands: new Float32Array(72), bandsTarget: new Float32Array(72),
    live: false, silent: true, lastFrameAt: 0, rate: 0,
  };
  const pw = (db) => Math.pow(10, db / 10);
  function onFrame(f) {
    A.lastFrameAt = performance.now();
    A.live = true;
    A.silent = !!f.silent;
    const rms = Math.max(f.rms[0], f.rms[1]);
    const vol = Math.max(0, Math.min(1.3, (rms + 42) / 40));
    const r = f.ranges || [-80, -80, -80, -80, -80, -80];
    const b = Math.sqrt(pw(r[0]) + pw(r[1])), m = Math.sqrt(pw(r[2]) + pw(r[3])), t = Math.sqrt(pw(r[4]) + pw(r[5]));
    const target = { vol, bass: Math.min(1.6, vol * b * 1.9), mid: Math.min(1.6, vol * m * 2.2), treb: Math.min(1.6, vol * t * 3.2) };
    for (const k of ['vol', 'bass', 'mid', 'treb']) {
      A[k] = target[k] > A[k] ? A[k] + (target[k] - A[k]) * 0.7 : A[k] + (target[k] - A[k]) * 0.25;
    }
    A.bassAtt += (A.bass - A.bassAtt) * 0.08;
    A.midAtt += (A.mid - A.midAtt) * 0.08;
    A.trebAtt += (A.treb - A.trebAtt) * 0.08;
    const now = A.lastFrameAt;
    A.avg += (A.bass - A.avg) * 0.06;
    if (A.bass > A.avg * 1.32 && A.bass > 0.18 && now - A.lastBeat > 200) { A.beat = 1; A.lastBeat = now; }
    A.hatAvg += (A.treb - A.hatAvg) * 0.1;
    if (A.treb > A.hatAvg * 1.4 && A.treb > 0.12) A.hat = 1;
    if (f.wave && f.wave.length) {
      const src = f.wave, n = Math.min(N, src.length);
      for (let i = 0; i < N; i++) A.waveTarget[i] = src[Math.floor(i * n / N)] || 0;
    }
    if (f.bands) for (let i = 0; i < 72; i++) A.bandsTarget[i] = Math.max(0, (f.bands[i] + 72) / 72);
  }
  function tickAudio(dt) {
    A.beat = Math.max(0, A.beat - dt * 3.2);
    A.hat = Math.max(0, A.hat - dt * 6);
    for (let i = 0; i < N; i++) A.wave[i] += (A.waveTarget[i] - A.wave[i]) * 0.45;
    for (let i = 0; i < 72; i++) A.bands[i] += (A.bandsTarget[i] - A.bands[i]) * 0.35;
    if (performance.now() - A.lastFrameAt > 1500 && A.live) {
      A.vol *= 0.97; A.bass *= 0.97; A.mid *= 0.97; A.treb *= 0.97;
      for (let i = 0; i < N; i++) A.waveTarget[i] *= 0.9;
    }
  }

  // ── which preset, and how far between ─────────────────────────────────────
  const blender = makeBlender({ seconds: BLEND_SECS });
  blender.set(Math.floor(Math.random() * 8));
  let auto = true, lastSwitch = 0, hueAcc = 0;
  let dwell = AUTO_MIN + Math.random() * (AUTO_MAX - AUTO_MIN);

  function showHud() {
    hud.classList.add('show'); btns.classList.add('show');
    clearTimeout(showHud._h);
    showHud._h = setTimeout(() => { hud.classList.remove('show'); btns.classList.remove('show'); }, 3200);
  }
  function setPreset(i) {
    if (blender.go(i)) { lastSwitch = clock; dwell = AUTO_MIN + Math.random() * (AUTO_MAX - AUTO_MIN); }
    showHud();
  }
  function wander() {
    if (blender.goRandom()) { lastSwitch = clock; dwell = AUTO_MIN + Math.random() * (AUTO_MAX - AUTO_MIN); }
  }

  // ── geometry for the wave ─────────────────────────────────────────────────
  function strip(points, thick, ar) {
    const n = points.length / 2;
    const out = new Float32Array(n * 2 * 3);
    let k = 0;
    for (let i = 0; i < n; i++) {
      const x = points[i * 2], y = points[i * 2 + 1];
      const x0 = points[Math.max(0, i - 1) * 2], y0 = points[Math.max(0, i - 1) * 2 + 1];
      const x1 = points[Math.min(n - 1, i + 1) * 2], y1 = points[Math.min(n - 1, i + 1) * 2 + 1];
      let nx = -(y1 - y0), ny = (x1 - x0);
      const len = Math.hypot(nx, ny) || 1; nx /= len; ny /= len;
      const tt = i / (n - 1);
      out[k++] = (x + nx * thick) / ar; out[k++] = y + ny * thick; out[k++] = tt;
      out[k++] = (x - nx * thick) / ar; out[k++] = y - ny * thick; out[k++] = tt;
    }
    return out;
  }
  function wavePoints(mode, t, scale) {
    const s = scale * (0.6 + 0.8 * A.vol), pts = [];
    if (mode === 'line') {
      for (let i = 0; i < N; i++) pts.push(-0.9 + 1.8 * i / (N - 1), A.wave[i] * s * 1.6);
    } else if (mode === 'dual') {
      for (let i = 0; i < N; i++) pts.push(-0.9 + 1.8 * i / (N - 1), 0.32 + A.wave[i] * s);
      for (let i = N - 1; i >= 0; i--) pts.push(-0.9 + 1.8 * i / (N - 1), -0.32 - A.wave[i] * s);
    } else if (mode === 'circle') {
      const r0 = 0.32 + 0.1 * A.bassAtt;
      for (let i = 0; i <= N; i++) { const j = i % N, ang = t * 0.15 + TAU * i / N; const r = r0 + A.wave[j] * s; pts.push(Math.cos(ang) * r, Math.sin(ang) * r); }
    } else if (mode === 'spiral') {
      for (let i = 0; i < N; i++) { const ang = t * 0.3 + TAU * 2 * i / N; const r = 0.12 + 0.5 * i / N + A.wave[i] * s * 0.8; pts.push(Math.cos(ang) * r, Math.sin(ang) * r); }
    } else if (mode === 'spectrum') {
      const B = 72, r0 = 0.22;
      for (let i = 0; i <= B * 2; i++) { const j = i < B ? i : (B * 2 - i) % B; const ang = -Math.PI / 2 + t * 0.1 + TAU * i / (B * 2); const r = r0 + A.bands[j] * A.bands[j] * 0.6 + 0.04 * A.beat; pts.push(Math.cos(ang) * r, Math.sin(ang) * r); }
    }
    return pts;
  }
  // The running hue turn, applied to a colour on its way to the shader.
  function turned(c) {
    const k = 0.57735, cs = Math.cos(hueAcc), sn = Math.sin(hueAcc), d = k * (c[0] + c[1] + c[2]);
    return [
      c[0] * cs + (k * c[2] - k * c[1]) * sn + k * d * (1 - cs),
      c[1] * cs + (k * c[0] - k * c[2]) * sn + k * d * (1 - cs),
      c[2] * cs + (k * c[1] - k * c[0]) * sn + k * d * (1 - cs),
    ];
  }

  // ── render ────────────────────────────────────────────────────────────────
  let cur = 0, last = performance.now(), t0 = last, clock = 0;
  function render(now) {
    requestAnimationFrame(render);
    resize();
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    clock = (now - t0) / 1000;
    const t = clock;
    tickAudio(dt);
    blender.advance(dt);

    // Auto-cycle prefers to start on a kick, but never waits forever for one.
    if (auto && !blender.blending && t - lastSwitch > dwell) {
      if (A.beat > 0.6 || t - lastSwitch > dwell + 10) wander();
    }

    const v = blender.state(t, A);
    hueAcc += dt * v.hueRate * (0.6 + 0.8 * A.midAtt);
    const ar = W / H;
    const prev = cur, next = 1 - cur;

    // 1. warp the previous frame into the next buffer
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[next]);
    gl.viewport(0, 0, W, H);
    gl.disable(gl.BLEND);
    gl.useProgram(warpP.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex[prev]);
    gl.uniform1i(warpP.u.uPrev, 0);
    gl.uniform2f(warpP.u.uRes, W, H);
    gl.uniform1f(warpP.u.uTime, t);
    gl.uniform1f(warpP.u.uZoom, v.zoom); gl.uniform1f(warpP.u.uRot, v.rot);
    gl.uniform1f(warpP.u.uWarp, v.warp); gl.uniform1f(warpP.u.uWarpSpeed, v.warpSpeed);
    gl.uniform1f(warpP.u.uDx, v.dx); gl.uniform1f(warpP.u.uDy, v.dy);
    gl.uniform1f(warpP.u.uSx, v.sx); gl.uniform1f(warpP.u.uSy, v.sy);
    gl.uniform1f(warpP.u.uDecay, v.decay);
    gl.uniform1f(warpP.u.uHueShift, dt * v.hueRate * 4.0);
    gl.uniform1f(warpP.u.uBass, A.bass); gl.uniform1f(warpP.u.uMid, A.mid);
    gl.uniform1f(warpP.u.uTreb, A.treb);
    gl.uniform1f(warpP.u.uSwirl, v.swirl); gl.uniform1f(warpP.u.uRipple, v.ripple);
    gl.uniform1f(warpP.u.uBlend, v.blend);
    gl.uniform1i(warpP.u.uModeA, v.modeA); gl.uniform1i(warpP.u.uModeB, v.modeB);
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.disableVertexAttribArray(1);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    // 2. the wave over it, additively. During a change both shapes are drawn,
    //    their weights summing to one, so the ink on screen never dips.
    if (A.live) {
      gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
      gl.useProgram(shapeP.p);
      gl.bindBuffer(gl.ARRAY_BUFFER, shapeBuf);
      const base = 0.55 + 0.35 * A.vol + 0.2 * A.beat;
      for (const w of v.waves) {
        const ca = turned(w.colA), cb = turned(w.colB);
        gl.uniform3f(shapeP.u.uColA, ca[0], ca[1], ca[2]);
        gl.uniform3f(shapeP.u.uColB, cb[0], cb[1], cb[2]);
        const pts = wavePoints(w.shape, t, w.scale);
        if (!pts.length) continue;
        gl.uniform1f(shapeP.u.uAlpha, base * w.weight);
        const geo = strip(pts, w.thick * (1 + 0.8 * A.beat), ar);
        gl.bufferData(gl.ARRAY_BUFFER, geo, gl.DYNAMIC_DRAW);
        gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 12, 0);
        gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 12, 8);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, geo.length / 3);
        // a fainter, wider echo of the same wave, for glow
        gl.uniform1f(shapeP.u.uAlpha, (0.12 + 0.1 * A.beat) * w.weight);
        const geo2 = strip(pts, w.thick * 3.2, ar);
        gl.bufferData(gl.ARRAY_BUFFER, geo2, gl.DYNAMIC_DRAW);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, geo2.length / 3);
      }
      gl.disable(gl.BLEND);
    }

    // 3. to the screen
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.useProgram(postP.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex[next]);
    gl.uniform1i(postP.u.uTex, 0);
    gl.uniform2f(postP.u.uRes, W, H);
    gl.uniform1i(postP.u.uKaleidoA, v.kaleidoA); gl.uniform1i(postP.u.uKaleidoB, v.kaleidoB);
    gl.uniform1f(postP.u.uBlend, v.blend);
    gl.uniform1f(postP.u.uBright, v.bright);
    gl.uniform1f(postP.u.uBeat, A.beat);
    gl.uniform1f(postP.u.uTime, t);
    gl.uniform1f(postP.u.uGamma, v.gamma);
    gl.uniform1f(postP.u.uChroma, v.chroma);
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    gl.disableVertexAttribArray(1);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    cur = next;

    if (hud.classList.contains('show')) {
      pname.textContent = v.name;
      pline.textContent = `${blender.target + 1}/${PRESETS.length} · ${auto ? 'wandering' : 'held'}`
        + (blender.blending ? ` · becoming ${PRESETS[blender.target].name}` : '')
        + (A.rate ? ` · ${(A.rate / 1000).toFixed(1)} kHz` : '');
    }
    center.classList.toggle('show', !A.live);
  }
  requestAnimationFrame(render);

  // ── events ────────────────────────────────────────────────────────────────
  if (window.__TAURI__ && window.__TAURI__.event) {
    window.__TAURI__.event.listen('listen:frame', (e) => onFrame(e.payload));
    window.__TAURI__.event.listen('listen:ended', () => { A.live = false; });
    window.__TAURI__.core.invoke('listen_status').then((st) => { if (st && st.sample_rate) A.rate = st.sample_rate; }).catch(() => {});
  }

  async function toggleFullscreen() {
    const w = tauriWin(); if (!w) return;
    try { const is = await w.isFullscreen(); await w.setFullscreen(!is); document.body.classList.toggle('hidecursor', !is); } catch (e) { /* not permitted */ }
  }
  async function leaveFullscreen() {
    const w = tauriWin(); if (!w) return;
    try { if (await w.isFullscreen()) await w.setFullscreen(false); document.body.classList.remove('hidecursor'); } catch (e) { /* not permitted */ }
  }
  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') { wander(); showHud(); e.preventDefault(); }
    else if (e.key === 'ArrowRight') setPreset(blender.target + 1);
    else if (e.key === 'ArrowLeft') setPreset(blender.target - 1);
    else if (e.key === 'a' || e.key === 'A') { auto = !auto; lastSwitch = clock; showHud(); }
    else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    else if (e.key === 'Escape') leaveFullscreen();
    else if (e.key === 'h' || e.key === 'H') help.classList.toggle('show');
    else if (e.key >= '1' && e.key <= '8') setPreset(parseInt(e.key, 10) - 1);
  });
  let cursorTimer = 0;
  document.addEventListener('mousemove', () => {
    showHud(); document.body.classList.remove('hidecursor');
    clearTimeout(cursorTimer);
    cursorTimer = setTimeout(async () => { const w = tauriWin(); if (w && await w.isFullscreen().catch(() => false)) document.body.classList.add('hidecursor'); }, 2000);
  });
  document.getElementById('b-next').addEventListener('click', () => { wander(); showHud(); });
  document.getElementById('b-full').addEventListener('click', toggleFullscreen);
  canvas.addEventListener('dblclick', toggleFullscreen);
  showHud();
})();
</script>
</body>
</html>
